name: Materialize project source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: "${{ !hashFiles('index.html') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project source
        run: |
          unzip -o "6a956acf99ce0c713476f8ae-52833ba3e3d98707.zip" -x "README.md" -d .
          rm -f "6a956acf99ce0c713476f8ae-52833ba3e3d98707.zip"
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Materialize project source from archived upload"
          git push
