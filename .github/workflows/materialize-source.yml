name: Materialize archived project source

on:
  push:
    paths:
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          test -f "6a956acf99ce0c713476f8ae-52833ba3e3d98707.zip"
          unzip -o "6a956acf99ce0c713476f8ae-52833ba3e3d98707.zip" -x "README.md" -d .
          rm -f "6a956acf99ce0c713476f8ae-52833ba3e3d98707.zip"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialize project source from archived upload"
          git push
